# This overrides the same file from systemd since we want to symlink everything
# into /etc instead of copying so updates to /usr propagate properly.
L /etc/os-release - - - - ../usr/lib/os-release

L+ /etc/mtab - - - - ../proc/self/mounts

# Copy over hostname file if missing
C /etc/hostname

# Contains the default systemd locale
C /etc/locale.conf
L /etc/nsswitch.conf
L /etc/issue
L /etc/profile
L /etc/profile.d

# Required by pam_env plugin
L /etc/security
# Required by pam environment plugin
L /etc/environment

# SSL Certs need to be in /etc/ssl for node apps to run
L /etc/ssl
# Certificates
L? /etc/ca-certificates
L? /etc/crypto-policies
L? /etc/pki
L /etc/debuginfod

# auditd requires config before starting
L /etc/audit

L? /etc/bashrc
L? /etc/bash.bashrc
L? /etc/bash.bash_logout

# Contains default font configuration
L /etc/fonts

# Configuration for man
L /etc/man_db.conf

# Configuration for ldconfig
L /etc/ld.so.conf
L /etc/ld.so.conf.d

# Copy in avahi config, which we probably need to edit
C /etc/avahi

# mosquitto
L /etc/mosquitto

# Required by tuned
L? /etc/tuned

# Required by fwupd
L /etc/fwupd

# Used by some services, like nftables
L? /etc/services

# Required by nftables service
L? /etc/nftables.conf

L? /etc/skel

# On some distributions various binaries in /usr/bin are managed via
# /etc/alternatives.
L? /etc/alternatives

# Copy NetworkManager and ModemManager configs
C /etc/NetworkManager
C /etc/ModemManager

# chrony NTP client
L /etc/chrony

# ModemManager needds its dbus policy file
L? /etc/dbus1/systemd.d/org.freedesktop.ModemManager1.conf

# Enable kernel config and boot counting
d /etc/kernel 0700 root root - -
L /etc/kernel/entry-token
L /etc/kernel/install.d
L /etc/kernel/postinst.d
L /etc/kernel/postrm.d
L /etc/kernel/preinst.d
C /etc/kernel/tries

# man fails without this in /etc/
L? /etc/manpath.config

# WPASupplicant also needs its configuration
L? /etc/wpa_supplicant/wpa_supplicant.conf

# Debian/Ubuntu PAM patches break /usr/lib/pam.d/ so symlink to /etc/
L /etc/pam.d - - - - /usr/lib/pam.d

# These can be dropped once https://bugs.debian.org/1108017 is fixed
L? /etc/adduser.conf
L? /etc/deluser.conf

# Link for plymouth config
L /etc/plymouth
